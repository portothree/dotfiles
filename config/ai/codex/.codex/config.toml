# Written to ~/.codex/config.toml by home-manager. MCP servers live in Zed's
# settings, not here; Codex in Zed gets them from Zed.
# The ChatGPT app adds its own entries (plugins, marketplaces, node_repl,
# project trust) to the written file; they're machine-specific and not kept here.
model = "gpt-6-astra"
model_reasoning_effort = "high"
service_tier = "priority"
model_provider = "aperture"

# Source: config/ai/codex/.codex/config.toml in https://github.com/portothree/dotfiles
# (checked out at ~/www/portothree/dotfiles); edit it there, not here.

# ChatGPT subscription passthrough through Tailscale Aperture (see the
# dotfiles README, "Aperture").
[model_providers.aperture]
name = "Aperture"
base_url = "http://localhost:8787/codex"
wire_api = "responses"
requires_openai_auth = true

[features]
js_repl = false
# Basic Memory is the only memory store. The ChatGPT app's "Enable Codex
# memories" toggle writes here too, but every switch puts this back.
memories = false

[memories]
use_memories = false
generate_memories = false

