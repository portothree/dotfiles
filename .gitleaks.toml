# Extends gitleaks' default rules.
[extend]
useDefault = true

# The vendored tailscale skill's API docs show `curl -u "$TOKEN:"` and
# `-u "tskey-api-xxxxx:"`. Only those two files, only that rule, and only
# lines whose credential is a $VAR or an xxxx placeholder are skipped.
[[allowlists]]
description = "curl -u placeholders in the tailscale skill's API docs"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''(^|/)config/ai/agents/\.agents/skills/tailscale/references/(api|device-management)\.md$''']
regexTarget = "line"
regexes = ['''-u\s+"(\$\{?[A-Z_]+\}?|[a-z-]*x{4,}):"''']
