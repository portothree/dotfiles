name: Update agent skills

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update skills from upstream
        id: sync
        working-directory: config/ai/agents
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills@1.7.2 update -p -y | tee "$RUNNER_TEMP/update.log"
          {
            echo 'summary<<EOF'
            grep -E "Updated|Failed|rror" "$RUNNER_TEMP/update.log" || true
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-agent-skills
          delete-branch: true
          commit-message: "chore(ai): update agent skills from upstream"
          title: "Update agent skills from upstream"
          body: |
            `npx skills update` found these upstream skill changes:

            ```
            ${{ steps.sync.outputs.summary }}
            ```

            Skills run with full agent permissions, so read the diff before merging. CI doesn't run automatically on PRs opened by this workflow; close and reopen the PR to trigger it.
