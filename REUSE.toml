# Licensing for every file in this repo (https://reuse.software). `reuse lint`
# runs as a pre-commit hook and in CI. License texts are in LICENSES/.
#
# When a matching annotation is found, the last one wins, so the default comes
# first and third-party paths after it. Copying in code or config from another
# project? Add an annotation for it here, and its license with
# `reuse download <SPDX-ID>`.
version = 1

# Default: my own work.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Gustavo Porto"
SPDX-License-Identifier = "MIT"

# Vendored agent skills (managed by `npx skills`, see skills-lock.json). A
# pre-commit hook checks that every skill in the lock file is listed here.

# https://github.com/tailscale/tailscale-skill
[[annotations]]
path = "config/ai/agents/.agents/skills/tailscale/**"
SPDX-FileCopyrightText = "2026 Tailscale Inc & contributors"
SPDX-License-Identifier = "BSD-3-Clause"

# https://github.com/basicmachines-co/basic-memory (skills/)
[[annotations]]
path = "config/ai/agents/.agents/skills/memory-*/**"
SPDX-FileCopyrightText = "Basic Machines"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# https://github.com/ayghri/i-have-adhd
[[annotations]]
path = "config/ai/agents/.agents/skills/i-have-adhd/**"
SPDX-FileCopyrightText = "2026 Ayoub Ghriss"
SPDX-License-Identifier = "MIT"

# Manifests generated by Flux v0.23.0, https://github.com/fluxcd/flux2
[[annotations]]
path = "cluster/base/flux-system/gotk-*.yaml"
SPDX-FileCopyrightText = "2020 The Flux authors"
SPDX-License-Identifier = "Apache-2.0"

# Started from aerc's default config, https://git.sr.ht/~rjarry/aerc
[[annotations]]
path = "config/comms/aerc/.config/aerc/aerc.conf"
SPDX-FileCopyrightText = ["2018-2019 Drew DeVault", "2026 Gustavo Porto"]
SPDX-License-Identifier = "MIT"

# Started from pgcli's default config, https://github.com/dbcli/pgcli
[[annotations]]
path = "config/dev/pgcli/.config/pgcli/config"
SPDX-FileCopyrightText = ["dbcli", "2026 Gustavo Porto"]
SPDX-License-Identifier = "BSD-3-Clause AND MIT"

# Pipe/read section adapted from bspwm's examples, https://github.com/baskerville/bspwm
[[annotations]]
path = "bin/bspwm/bar"
SPDX-FileCopyrightText = ["2012 Bastien Dejean", "2026 Gustavo Porto"]
SPDX-License-Identifier = "BSD-2-Clause AND MIT"
